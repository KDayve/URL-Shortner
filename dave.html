<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Menswear</title>
    <!-- LINKING THE CSS FILE -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">APEX MENSWEAR</div>
        <button class="cart-btn" onclick="toggleCart()">Cart (<span id="cart-count">0</span>)</button>
    </header>

    <!-- Main Content -->
    <main>
        <h2 class="section-title">New Arrivals</h2>
        <div class="product-grid" id="product-list">
            <!-- Products will be injected here by JavaScript -->
        </div>
    </main>

    <!-- Cart Overlay (Dims background when cart is open) -->
    <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items">
            <p style="text-align:center; color:#888;">Your cart is empty.</p>
        </div>
        <div class="cart-footer">
            <h4>Total: $<span id="cart-total">0.00</span></h4>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- LINKING THE JAVASCRIPT FILE -->
    <script src="script.js"></script>
</body>
</html>
